# Configuração principal. Os valores vêm do arquivo .env (na raiz do projeto) ou de variáveis de ambiente.
# Sem nenhuma chave, o sistema roda inteiro com o simulador de WhatsApp e a IA em modo demo.
spring:
  application:
    name: panocerto
  autoconfigure:
    # Não usamos o usuário padrão do Spring Security: o login é por JWT (AuthControle)
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  config:
    # Lê o .env no formato CHAVE=valor (rodando de dentro de /backend ou da raiz)
    import:
      - "optional:file:../.env[.properties]"
      - "optional:file:.env[.properties]"
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:panocerto}
    username: ${DB_USER:panocerto}
    password: ${DB_PASSWORD:panocerto}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # o esquema é criado pelo Flyway, o Hibernate só confere
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

panocerto:
  jwt-secret: ${JWT_SECRET:troque-este-segredo-antes-de-usar-em-producao-0123456789}
  jwt-horas: 12
  anthropic-api-key: ${ANTHROPIC_API_KEY:}
  anthropic-model: ${ANTHROPIC_MODEL:claude-sonnet-5-5}
  openai-api-key: ${OPENAI_API_KEY:}
  whatsapp-token: ${WHATSAPP_TOKEN:}
  whatsapp-phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
  whatsapp-verify-token: ${WHATSAPP_VERIFY_TOKEN:}
  whatsapp-app-secret: ${WHATSAPP_APP_SECRET:}
  whatsapp-template-lembrete: ${WHATSAPP_TEMPLATE_LEMBRETE:lembrete_pano}
  custo-aplicacao-ha: ${CUSTO_APLICACAO_HA:120}
  pasta-uploads: ${PASTA_UPLOADS:./uploads}
  carregar-dados-exemplo: true
  origens-permitidas: ${ORIGENS_PERMITIDAS:http://localhost:5173}
